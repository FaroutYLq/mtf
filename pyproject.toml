[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtf"
version = "0.1.0"
description = "My Theorist Friend — multi-agent system for experimental physicists"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.49",
    "anthropic>=0.40.0",
    "arxiv>=2.1.0",
    "semanticscholar>=0.8.4",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "lmfit>=1.3.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[project.scripts]
mtf = "mtf.cli:main"
mtf-gui = "mtf.gui:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.9", "ruff>=0.4"]
gpd = ["get-physics-done>=1.1.0", "mcp>=1.26.0"]
gui = ["streamlit>=1.35.0"]
docs = ["sphinx>=7.3", "sphinx-book-theme>=1.1", "myst-parser>=3.0", "sphinx-autodoc-typehints>=2.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["network: marks tests that require network access"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
